// Extensions to ProfileService beyond CRUD. The contents of this file are
// merged by proto-merge into the generated profile_svc.g.proto.

service ProfileService {
  // List enumerates all stored profiles.
  rpc List(ProfileListRequest) returns (ProfileListResponse);
}

message ProfileListRequest {}

message ProfileListResponse {
  // List of profiles.
  repeated Profile items = 1;
}
