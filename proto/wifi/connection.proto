edition = "2023";

package wifi;

import "orm.proto";
import "wifi/access_point.proto";
import "wifi/interface.proto";
import "wifi/profile.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

// Connection은 "지금 활성화되어 있는 연결" 하나를 나타낸다.
//
// Add는 주어진 Interface에 Profile을 적용해 새 연결을 활성화하고,
// Erase는 활성 연결을 해제한다. 하나의 Interface 위에는 동시에 둘 이상의
// Connection이 존재할 수 없다(라디오는 한 번에 한 네트워크에만 붙는다).
// "수정" 개념은 없고(설정을 바꾸려면 해제 후 재활성화한다) Patch도 의미상
// 맞지 않지만, 테스트(mock 등)의 편의를 위해 CRUD를 모두 정의해 둔다.
// 실제 서비스 구현은 Patch에 대해 unimplemented를 반환한다.
//
// 이 메세지는 연결의 *정체성*(어떤 인터페이스/프로파일 조합인지)만 담는다.
// 연결 진행 상태나 할당된 IP 같은 실시간 정보는 계속 변하므로 엔티티
// 필드로 저장하지 않고, ConnectionService.Watch/GetStatus가 돌려주는
// ConnectionStatus로 전달한다(connection_svc.ext.proto 참고).
message Connection {
  // 연결 식별자(자동 생성 UUID).
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // 이 연결이 사용하는 무선 인터페이스. 활성화 후에는 바꿀 수 없다.
  Interface interface = 8 [(orm.edge) = {immutable: true}];
  // 이 연결에 적용된 프로파일(자격 증명/IP 설정 등). 바꿀 수 없다.
  Profile profile = 9 [(orm.edge) = {immutable: true}];
  // 연결을 특정 AP(BSS)에 고정하고 싶을 때 지정한다. 지정하지 않으면
  // 같은 SSID 중 시스템이 적절한 AP를 선택한다(로밍 포함).
  AccessPoint access_point = 10 [(orm.edge) = {
    nullable: true
    immutable: true
  }];

  // 테스트 편의를 위해 CRUD를 모두 정의한다(실제 서비스는 Patch에 대해
  // unimplemented 반환).
  option (orm.message) = {rpc: {crud: true}};
}
