edition = "2023";

package wifi;

import "orm.proto";
import "wifi/access_point.proto";
import "wifi/interface.proto";
import "wifi/profile.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

// Connection represents a single "currently active connection".
//
// Add activates a new connection by applying a Profile to a given Interface,
// and Erase tears down an active connection. No more than one Connection can
// exist on a single Interface at a time (a radio attaches to only one network
// at a time). There is no notion of "modify" (to change settings you tear down
// and re-activate) and Patch does not make semantic sense either, but for the
// convenience of testing (mocks, etc.) all CRUD operations are defined. The
// real service implementation returns unimplemented for Patch.
//
// This message holds only the connection's *identity* (which interface/profile
// combination it is). Real-time information such as connection progress or the
// assigned IP keeps changing, so it is not stored as entity fields; instead it
// is delivered via the ConnectionStatus returned by
// ConnectionService.Watch/GetStatus (see connection_svc.ext.proto).
message Connection {
  // Connection identifier (auto-generated UUID).
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The wireless interface this connection uses. Cannot be changed after activation.
  Interface interface = 8 [(orm.edge) = {immutable: true}];
  // The profile applied to this connection (credentials/IP settings, etc.). Cannot be changed.
  Profile profile = 9 [(orm.edge) = {immutable: true}];
  // Set this when you want to pin the connection to a specific AP (BSS). If not
  // set, the system selects an appropriate AP among those with the same SSID
  // (including roaming).
  AccessPoint access_point = 10 [(orm.edge) = {
    nullable: true
    immutable: true
  }];

  // Define all CRUD for testing convenience (the real service returns
  // unimplemented for Patch).
  option (orm.message) = {rpc: {crud: true}};
}
