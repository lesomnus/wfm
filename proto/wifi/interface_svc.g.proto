edition = "2023";
package wifi;

import "google/protobuf/empty.proto";
import "wifi/interface.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

service InterfaceService {
  // Add creates a new Interface
  rpc Add(InterfaceAddRequest) returns (Interface);
  // Get retrieves a Interface
  rpc Get(InterfaceGetRequest) returns (Interface);
  // Patch updates an existing Interface
  rpc Patch(InterfacePatchRequest) returns (Interface);
  // Erase deletes a Interface
  rpc Erase(InterfaceRef) returns (google.protobuf.Empty);
  // List enumerates all wireless interfaces on the node.
  rpc List(InterfaceListRequest) returns (InterfaceListResponse);
  // SetPower turns the interface's radio on or off.
  rpc SetPower(InterfaceSetPowerRequest) returns (Interface);
}

message InterfaceAddRequest {
  string id = 1;
  string name = 5;
  string desc = 6;
  string mac = 7;
  bool powered = 8;
  bool up = 9;
}

message InterfaceGetRequest {
  InterfaceRef ref = 1;
  InterfaceSelect select = 2;
}

message InterfaceRef {
  oneof key {
    string id = 1;
  }
}

message InterfaceSelect {
  bool all = 1;
  bool name = 5;
  bool desc = 6;
  bool mac = 7;
  bool powered = 8;
  bool up = 9;
}

message InterfacePatchRequest {
  InterfaceRef ref = 1;
  string name = 9;
  bool name_null = 10;
  string desc = 11;
  bool desc_null = 12;
  string mac = 13;
  bool mac_null = 14;
  bool powered = 15;
  bool powered_null = 16;
  bool up = 17;
  bool up_null = 18;
}

message InterfaceListRequest {}

message InterfaceListResponse {
  // List of interfaces.
  repeated Interface items = 1;
}

message InterfaceSetPowerRequest {
  // The interface whose power to control.
  InterfaceRef ref = 1;
  // If true, turn the radio on; if false, turn it off.
  bool on = 2;
}
