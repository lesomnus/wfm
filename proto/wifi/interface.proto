edition = "2023";

package wifi;

import "orm.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

// Interface represents a single wireless network interface (radio) on a remote
// node. e.g. wlan0. A node may have more than one.
//
// An interface is a target that is *discovered* from the hardware, so having a
// client create or delete it directly does not make semantic sense. However,
// for the convenience of testing (mocks, etc.) all CRUD operations are defined,
// and the real service implementation returns unimplemented for
// Add/Patch/Erase. Listing and power control (on/off) are added as separate
// RPCs in the InterfaceService extension (interface_svc.ext.proto).
message Interface {
  // Interface identifier. Depending on the implementation, the ifname
  // (e.g. "wlan0") may be used directly.
  string id = 1 [(orm.field) = {
    key: true
    default: ""
  }];
  // Human-readable name.
  string name = 5 [(orm.field) = {default: ""}];
  // Description.
  string desc = 6 [(orm.field) = {default: ""}];

  // Hardware (MAC) address.
  string mac = 7 [(orm.field) = {default: ""}];
  // Radio power state (rfkill, etc.). If true, it is on and scanning/connecting
  // is possible. Reported by the system; use InterfaceService.SetPower to change
  // the value.
  bool powered = 8 [(orm.field) = {default: ""}];
  // Whether the link is up (active). A read-only state reported by the system.
  bool up = 9 [(orm.field) = {default: ""}];

  // Define all CRUD for testing convenience (the real service returns
  // unimplemented for Add/Patch/Erase).
  option (orm.message) = {rpc: {crud: true}};
}
