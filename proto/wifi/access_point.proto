edition = "2023";

package wifi;

import "orm.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

// KeyManagement는 AP가 사용하는 인증/키 관리 프로토콜을 식별한다.
//
// 스캔 결과(AccessPoint)에서는 "AP가 지원하는 방식"을 나타내고,
// 프로파일(Profile)의 Security와 짝을 이루어 어떤 자격 증명을 써야 하는지를
// 결정하는 데 쓰인다.
enum KeyManagement {
  KEY_MANAGEMENT_UNSPECIFIED = 0;

  // 개방형 네트워크. 인증이 없다.
  KEY_MANAGEMENT_NONE = 1;
  // WPA/WPA2 personal. 사전 공유 키(비밀번호) 기반.
  KEY_MANAGEMENT_WPA_PSK = 2;
  // WPA3 personal (SAE). 마찬가지로 비밀번호 기반.
  KEY_MANAGEMENT_SAE = 3;
  // WPA/WPA2/WPA3 enterprise (802.1X/EAP). 아직 구현되지 않음.
  KEY_MANAGEMENT_WPA_EAP = 4;
  // Enhanced Open (OWE). 비밀번호 없이 암호화한다. 아직 구현되지 않음.
  KEY_MANAGEMENT_OWE = 5;
}

// AccessPoint는 스캔으로 발견된 무선 네트워크(BSS)를 나타낸다.
//
// 스캔 결과는 라디오 환경에 의해 *발견*되는 것이지 클라이언트가 만드는
// 것이 아니므로 Add/Patch/Erase는 의미상 맞지 않는다. 다만 테스트(mock 등)의
// 편의를 위해 CRUD를 모두 정의해 두고, 실제 서비스 구현은 이들에 대해
// unimplemented를 반환한다. 스캔 자체는 AccessPointService.Scan
// (access_point_svc.ext.proto)에서 추가한다.
message AccessPoint {
  // 발견된 AP의 안정적인 식별자. 구현은 BSSID를 그대로 쓸 수 있다.
  string id = 1 [(orm.field) = {
    key: true
    default: ""
  }];

  // 네트워크 이름(SSID). 히든 네트워크의 경우 비어 있을 수 있다.
  string ssid = 2 [(orm.field) = {default: ""}];
  // AP의 하드웨어 주소(BSSID).
  string bssid = 3 [(orm.field) = {default: ""}];
  // 신호 품질(0-100). 클수록 강하다(NetworkManager Strength와 동일 척도).
  int32 signal = 4 [(orm.field) = {default: ""}];
  // 채널 주파수(MHz). 예: 2412(2.4GHz), 5180(5GHz).
  uint32 frequency = 5 [(orm.field) = {default: ""}];

  // 이 AP가 광고하는 인증/키 관리 방식들.
  // 클라이언트는 이 목록을 보고 알맞은 Security를 가진 Profile을 고른다.
  repeated KeyManagement key_management = 6;

  // 테스트 편의를 위해 CRUD를 모두 정의한다(실제 서비스는 Add/Patch/Erase에
  // 대해 unimplemented 반환).
  option (orm.message) = {rpc: {crud: true}};
}
