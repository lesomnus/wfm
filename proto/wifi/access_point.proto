edition = "2023";

package wifi;

import "orm.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

// KeyManagement identifies the authentication/key-management protocol an AP uses.
//
// In scan results (AccessPoint) it indicates "the methods the AP supports", and
// paired with a Profile's Security it is used to decide which credentials must
// be used.
enum KeyManagement {
  KEY_MANAGEMENT_UNSPECIFIED = 0;

  // Open network. No authentication.
  KEY_MANAGEMENT_NONE = 1;
  // WPA/WPA2 personal. Based on a pre-shared key (password).
  KEY_MANAGEMENT_WPA_PSK = 2;
  // WPA3 personal (SAE). Also password based.
  KEY_MANAGEMENT_SAE = 3;
  // WPA/WPA2/WPA3 enterprise (802.1X/EAP). Not implemented yet.
  KEY_MANAGEMENT_WPA_EAP = 4;
  // Enhanced Open (OWE). Encrypts without a password. Not implemented yet.
  KEY_MANAGEMENT_OWE = 5;
}

// AccessPoint represents a wireless network (BSS) discovered by a scan.
//
// Scan results are *discovered* through the radio environment rather than
// created by a client, so Add/Patch/Erase do not make semantic sense. However,
// for the convenience of testing (mocks, etc.) all CRUD operations are defined,
// and the real service implementation returns unimplemented for them. The scan
// itself is added by AccessPointService.Scan (access_point_svc.ext.proto).
message AccessPoint {
  // Stable identifier of the discovered AP. Implementations may use the BSSID
  // directly.
  string id = 1 [(orm.field) = {
    key: true
    default: ""
  }];

  // Network name (SSID). May be empty for hidden networks.
  string ssid = 2 [(orm.field) = {default: ""}];
  // Hardware address (BSSID) of the AP.
  string bssid = 3 [(orm.field) = {default: ""}];
  // Signal quality (0-100). Higher is stronger (same scale as NetworkManager Strength).
  int32 signal = 4 [(orm.field) = {default: ""}];
  // Channel frequency (MHz). e.g. 2412 (2.4GHz), 5180 (5GHz).
  uint32 frequency = 5 [(orm.field) = {default: ""}];

  // The authentication/key-management methods this AP advertises.
  // A client looks at this list to pick a Profile with a matching Security.
  repeated KeyManagement key_management = 6;

  // Define all CRUD for testing convenience (the real service returns
  // unimplemented for Add/Patch/Erase).
  option (orm.message) = {rpc: {crud: true}};
}
