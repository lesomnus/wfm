edition = "2023";
package wifi;

import "google/protobuf/empty.proto";
import "wifi/access_point_svc.g.proto";
import "wifi/connection.proto";
import "wifi/interface_svc.g.proto";
import "wifi/profile_svc.g.proto";

option go_package = "github.com/lesomnus/wfm/internal/wifi";

service ConnectionService {
  // Add creates a new Connection
  rpc Add(ConnectionAddRequest) returns (Connection);
  // Get retrieves a Connection
  rpc Get(ConnectionGetRequest) returns (Connection);
  // Patch updates an existing Connection
  rpc Patch(ConnectionPatchRequest) returns (Connection);
  // Erase deletes a Connection
  rpc Erase(ConnectionRef) returns (google.protobuf.Empty);
  // List enumerates the currently active connections.
  rpc List(ConnectionListRequest) returns (ConnectionListResponse);
  // Watch streams state changes until the connection reaches a terminal state
  // (CONNECTED or FAILED). It is the core of the "enter the password and wait
  // to be connected" flow; results such as an authentication failure (wrong
  // password) are also delivered through this stream.
  rpc Watch(ConnectionRef) returns (stream ConnectionStatus);
  // GetStatus queries the current state of a connection once (a snapshot).
  rpc GetStatus(ConnectionRef) returns (ConnectionStatus);
}

message ConnectionAddRequest {
  bytes id = 1;
  InterfaceRef interface = 8;
  ProfileRef profile = 9;
  AccessPointRef access_point = 10;
}

message ConnectionGetRequest {
  ConnectionRef ref = 1;
  ConnectionSelect select = 2;
}

message ConnectionRef {
  oneof key {
    bytes id = 1;
  }
}

message ConnectionSelect {
  bool all = 1;
  InterfaceSelect interface = 8;
  ProfileSelect profile = 9;
  AccessPointSelect access_point = 10;
}

message ConnectionPatchRequest {
  ConnectionRef ref = 1;
}

message ConnectionListRequest {
  // If set, return only the connections of that interface (optional).
  InterfaceRef interface = 1;
}

message ConnectionListResponse {
  // List of active connections.
  repeated Connection items = 1;
}

// ConnectionStatus is a real-time snapshot of an active connection's state.
//
// It keeps changing while the connection is maintained, so it is not stored on
// the Connection entity and is delivered separately via Watch/GetStatus.
message ConnectionStatus {
  // Current progress state.
  ConnectionState state = 1;
  // The failure cause, set when state == FAILED.
  ConnectionError error = 2;
  // Human-readable additional description of the current state/error (optional).
  string detail = 3;

  // BSSID of the currently associated AP. May change on roaming.
  string bssid = 4;
  // Current signal quality (0-100). Higher is stronger (same scale as NetworkManager Strength).
  int32 signal = 5;

  // The addresses actually assigned after connecting (CIDR notation).
  repeated string addresses = 6;
  // The default gateway actually applied.
  string gateway = 7;
  // The DNS servers actually applied.
  repeated string dns = 8;
}

// ConnectionState represents the progress state of an active connection.
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;

  // Not started yet.
  CONNECTION_STATE_IDLE = 1;
  // Associating with the AP (BSS selection/association).
  CONNECTION_STATE_ASSOCIATING = 2;
  // Performing the security handshake (e.g. WPA 4-way handshake).
  CONNECTION_STATE_AUTHENTICATING = 3;
  // Obtaining IP configuration (DHCP/SLAAC).
  CONNECTION_STATE_CONFIGURING = 4;
  // Fully connected and usable (successful terminal state).
  CONNECTION_STATE_CONNECTED = 5;
  // Connection failed (terminal state). See error for the cause.
  CONNECTION_STATE_FAILED = 6;
  // Being torn down.
  CONNECTION_STATE_DISCONNECTING = 7;
}

// ConnectionError explains why a connection failed.
enum ConnectionError {
  CONNECTION_ERROR_UNSPECIFIED = 0;

  // No error.
  CONNECTION_ERROR_NONE = 1;
  // Authentication failed (wrong password / credential rejected).
  CONNECTION_ERROR_AUTH_FAILED = 2;
  // The target SSID could not be found.
  CONNECTION_ERROR_NETWORK_NOT_FOUND = 3;
  // Association/handshake timed out.
  CONNECTION_ERROR_ASSOC_TIMEOUT = 4;
  // IP configuration (DHCP, etc.) failed.
  CONNECTION_ERROR_IP_CONFIG_FAILED = 5;
  // Disconnected by the AP / signal lost.
  CONNECTION_ERROR_DISCONNECTED = 6;
  // Unknown error.
  CONNECTION_ERROR_UNKNOWN = 7;
}
