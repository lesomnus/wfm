# wfm configuration.
# See the `otel` section for OpenTelemetry export settings.

# Interfaces the server hides from wfm entirely. An excluded interface never
# appears in listings and every operation targeting it (or a connection bound to
# it) behaves as if it does not exist. Match by name, MAC, or PCI address; a
# rule may combine fields (all must match), and any matching rule excludes.
#
# interface:
#   exclude:
#     - name: eth0
#     - mac: "AA:BB:CC:DD:EE:FF"
#     - pci: "0000:02:00.0"

# OpenWrt ubus backend (only used with `--backend ubus`). Controls wifi on a
# remote node over ubus JSON-RPC (rpcd + uhttpd-mod-ubus). The password is read
# from password_file so it is not printed by `wfm config`.
#
# ubus:
#   endpoint: http://192.168.1.1/ubus
#   username: root
#   password_file: /run/secrets/wfm-ubus
#   insecure: false   # true skips TLS verification (self-signed cert)
#   radio: radio0     # wifi-device new station profiles attach to ("" = first)
#   network: wwan     # network interface a station binds to for DHCP
